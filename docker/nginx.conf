server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The API is reached directly by the browser, not proxied through here, so the CSP has to allow
    # connections to it. connect-src is set from the entrypoint because the API origin is only known
    # at run time; the rest is fixed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed filenames, so the content of a given URL can never change. A year is the standard
    # maximum, and immutable tells the browser not to revalidate even on a reload.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Never cached. index.html is what points at the hashed bundles, so a stale copy pins the whole
    # app to an old deployment.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Written at container start. Caching it would defeat the point of configuring at run time.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The SPA fallback. Every unmatched path returns index.html so the Angular router can handle
    # deep links; without it, refreshing on /boards/<id> is a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
